<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mushaira: a gathering of Urdu poets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="eranav" id="eranav"></div>
  <nav aria-label="Views">
    <button data-view="dial" aria-pressed="true">Dial</button>
    <button data-view="timeline" aria-pressed="false">Timeline</button>
  </nav>
</header>
<main>
  <section id="poets" aria-label="Poets">
    <div class="scroller">
      <div class="stage" id="stage">
        <div class="ring" aria-hidden="true"></div>
        <div class="axis" aria-hidden="true"></div>
        <span class="brk" id="brk" aria-hidden="true">axis compressed here</span>
        <div class="hub" aria-hidden="true"><h2 id="hubName"></h2><p id="hubYears"></p></div>
      </div>
    </div>
    <div class="ctrl">
      <button id="prev" aria-label="Previous poet">&lsaquo;</button>
      <button id="next" aria-label="Next poet">&rsaquo;</button>
    </div>
    <section id="detail" class="sec"></section>
  </section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
