<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mushaira: a gathering of Urdu poets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav class="eranav" id="eranav" aria-label="Eras"></nav>
  <div class="sw" role="group" aria-label="View">
    <button type="button" data-view="mushaira" aria-pressed="true">Mushaira</button>
    <button id="sw" type="button" role="switch" aria-label="Switch between Mushaira and Timeline" aria-checked="false"><i></i></button>
    <button type="button" data-view="timeline" aria-pressed="false">Timeline</button>
  </div>
</header>
<main class="poets" id="poets">
  <div class="scroller">
    <div class="stage" id="stage">
      <svg class="arc" id="arc" aria-hidden="true"></svg>
      <div class="axis" id="axis" aria-hidden="true"></div>
    </div>
  </div>
  <section class="detail" id="detail"></section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
